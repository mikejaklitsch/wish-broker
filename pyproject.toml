# Vercel deployment. The server is server/wish_broker/app.py; it mounts the built web page
# (web/dist), which Vercel moves to its CDN. Local development still uses dev.sh and server/requirements.txt.
[project]
name = "wish-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "anthropic>=2.9",
    "elevenlabs>=2.0",
]

[tool.vercel]
entrypoint = "server.wish_broker.app:app"

[tool.vercel.scripts]
build = "cd web && npm ci && npm run build"
