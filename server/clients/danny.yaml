questions:
  - id: perfect
    text: What does perfect look like to you?
    reveals: goal
    answer: "So, perfect is she says yes, obviously. But I also want her to love how I ask, like, she's still telling people about it when we're eighty. We've got dinner at eight tonight, up on the roof at the place where we had our first date."
  - id: her
    text: Tell me about her.
    reveals: rachel
    answer: "Her name's Rachel, and we've been together four years. She's the smartest person I know, and she still laughs at my jokes, so her judgment's not perfect, but I'll take it."
  - id: ring
    text: Do you have a ring?
    reveals: ring
    answer: "Yeah, it was my grandma's. My mom gave it to me last month, and I about cried in the kitchen. It's not fancy, but it has to be that ring."
  - id: surprises
    text: Does she like surprises?
    requires: [goal]
    reveals: spotlight
    answer: "She likes little ones, sure. But if a bunch of people are looking at her, she freezes up. At her own birthday party, she hid in the bathroom for twenty minutes, and I brought her cake in there."
  - id: weather
    text: What if the weather's bad?
    requires: [goal]
    reveals: rain
    answer: "Oh, jeez, don't even say that. They said maybe rain tonight. I've checked the forecast about every ten minutes since six this morning."
  - id: first_date
    text: What happened on your first date?
    requires: [goal]
    reveals: first_date
    answer: "I knocked a whole glass of red wine into her lap. [laughs] She laughed so hard she cried, and I'm standing there holding nine napkins. That's when I knew."

refused_review: "I asked for help with the biggest night of my life, and all I got was a call saying no. I'm not even mad. No, I'm a little mad."
